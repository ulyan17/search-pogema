# Stage 2: exploration quality without early stopping (full horizon), evaluation seeds 0..19.
name: stage2_coverage
output: results/stage2_coverage.csv
seeds: {start: 0, count: 20}
base: {map_type: random, density: 0.2, num_targets: 3, stop_when_all_found: false, start: cluster}
grid:
  size: [32]
  num_agents: [4, 16]
  target_dist: [uniform]
  fail_frac: [0.0, 0.5]
methods:
  - {label: random_walk, policy: random_walk}
  - {label: levy, policy: levy}
  - {label: frontier, policy: frontier, task: {comm_radius: 0}}
  - {label: frontier_comm, policy: frontier_comm, task: {comm_radius: [2, 5, inf]}}
  - {label: swarm, policy: swarm}
